<!doctype html>
<!--
  The captive-portal setup page, served verbatim by GET / in wifi_prov.c.

  ONE PAGE, NO ASSETS. A second request for a stylesheet or a script is a second
  chance for a captive-portal webview to wander off to its connectivity check
  instead, so the CSS and JS are inline and nothing here may reference an
  external file.

  Embedded through EMBED_TXTFILES, so every byte of it -- including this comment
  and the indentation -- sits in flash rodata and goes out over the wire. Keep it
  small, but do not sacrifice legibility for a few hundred bytes: the AP link is
  the only thing serving it and there is exactly one client.

  Two endpoints back it, both in wifi_prov.c:
    GET  /scan  -> {"key_set":bool,"nets":[{"ssid","rssi","open"},...]}
    POST /save  -> form-urlencoded ssid, pass, key; saves and reboots

  To preview a change without flashing: open this file in a browser. The /scan
  fetch fails, so you get the scan-failed fallback with the manual SSID box
  showing. That is a real state worth checking, but to see the populated one you
  need to stub fetch() -- see host/README.md.
-->
<html>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Deepgram Agent setup</title>
<style>
/* Deepgram's 2026 brand (starter kit p.13): Off-black ground, Off-white type,
 * Fuchsia for the one action and what it says back. The glass edge is the kit's
 * panel treatment, kept to a hairline so the fields read on a phone at arm's
 * length. System fonts on purpose: the phone has no internet while it is on
 * this AP, so Work Sans and Azeret Mono could only come in as embedded bytes. */
:root{--fuchsia:#E042FF;--ink:#1D1D1D;--paper:#FCFAF8;--gray:#C4C4C4;
--panel:rgba(252,250,248,.04);--edge:rgba(252,250,248,.16);--faint:#8f8f8f;
--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:24px;
background:var(--ink);color:var(--paper)}
h1{font-size:24px;font-weight:500;letter-spacing:-.01em;margin:0 0 6px}
p.sub{margin:0 0 20px;color:var(--gray);font-size:15px}
label{display:block;margin:18px 0 8px;font-family:var(--mono);font-size:12px;
letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
/* 16px text: anything smaller and iOS zooms the page when a field takes focus. */
select,input[type=text],input[type=password]{width:100%;box-sizing:border-box;
padding:12px 14px;font-size:16px;background:var(--panel);color:var(--paper);
border:1px solid var(--edge);border-radius:12px}
select option{background:var(--ink)}
button{width:100%;margin-top:28px;padding:15px;font-family:var(--mono);font-size:15px;
font-weight:600;letter-spacing:.08em;text-transform:uppercase;
background:var(--fuchsia);color:var(--ink);border:0;border-radius:999px}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--fuchsia);outline-offset:2px}
#msg{margin-top:16px;font-size:14px;color:var(--fuchsia);min-height:20px}
p.hint{margin:8px 0 0;font-size:12px;color:var(--faint)}
/* Not a <label> lookalike: these are sentences, so no mono and no capitals. */
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:inherit;
font-size:13px;letter-spacing:0;text-transform:none;color:var(--gray)}
.chk input{width:auto;accent-color:var(--fuchsia)}
/* The wordmark's paths are fill=currentColor, so `color` inks it. The space
 * under it is the logo's clear space: the kit forbids locking it up with
 * anything, the heading included. */
.dg-wordmark{display:block;width:124px;height:auto;color:var(--paper);margin:0 0 32px}
</style>
</head>
<body>

<h1>Set up your agent</h1>
<p class='sub'>Pick the network this device should join.</p>

<form id='f'>
<label for='net'>Network</label>
<select id='net'><option value=''>scanning...</option></select>

<div id='manual' style='display:none'>
<label for='ssid'>Network name</label>
<input type='text' id='ssid' autocapitalize='none' autocorrect='off' placeholder='SSID'>
</div>

<label for='pass'>Password</label>
<input type='password' id='pass' placeholder='leave empty if open'>
<label class='chk'><input type='checkbox' id='show'> Show password</label>

<label for='key'>Deepgram API key</label>
<input type='password' id='key' autocapitalize='none' autocorrect='off'
spellcheck='false' placeholder='paste your key'>
<label class='chk'><input type='checkbox' id='showk'> Show key</label>
<p class='hint' id='keyhint'></p>

<label for='tz'>Timezone</label>
<input type='text' id='tz' autocapitalize='none' autocorrect='off'
spellcheck='false' placeholder='e.g. America/Chicago'>
<p class='hint'>For the clock and alarms. Filled in from this phone; you can also
change it later by asking the device.</p>

<button type='submit' id='go'>Save and connect</button>
</form>
<div id='msg'></div>

<script>
var sel=document.getElementById('net'),msg=document.getElementById('msg');
var man=document.getElementById('manual');
function opt(v,t){var o=document.createElement('option');o.value=v;o.textContent=t;
sel.appendChild(o);return o}
var hint=document.getElementById('keyhint');

/* The scan is answered from a cache taken once at start-up -- scanning again
 * would starve the AP link this page arrived over. */
fetch('/scan').then(function(r){return r.json()}).then(function(d){
sel.innerHTML='';
d.nets.forEach(function(n){opt(n.ssid,n.ssid+'  ('+n.rssi+' dBm)'+(n.open?'  open':''))});
opt('__other__','Other / hidden network...');
var tz=document.getElementById('tz');
try{tz.value=d.tz||Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(x){tz.value=d.tz||''}
hint.textContent=d.key_set?'A key is already stored. Leave this blank to keep it.'
:'No key stored yet - this device cannot talk until one is set.';
}).catch(function(){sel.innerHTML='';opt('__other__','scan failed - enter manually');
man.style.display='block'});

sel.onchange=function(){man.style.display=(sel.value=='__other__')?'block':'none'};
document.getElementById('show').onchange=function(){
document.getElementById('pass').type=this.checked?'text':'password'};
document.getElementById('showk').onchange=function(){
document.getElementById('key').type=this.checked?'text':'password'};

document.getElementById('f').onsubmit=function(e){
e.preventDefault();
var s=sel.value=='__other__'?document.getElementById('ssid').value:sel.value;
if(!s){msg.textContent='Pick or enter a network.';return}
document.getElementById('go').disabled=true;msg.textContent='Saving...';
fetch('/save',{method:'POST',
headers:{'Content-Type':'application/x-www-form-urlencoded'},
body:'ssid='+encodeURIComponent(s)+'&pass='+
encodeURIComponent(document.getElementById('pass').value)+'&key='+
encodeURIComponent(document.getElementById('key').value.trim())+'&tz='+
encodeURIComponent(document.getElementById('tz').value.trim())})
.then(function(){msg.textContent='Saved. Restarting to join '+s+'. '
+'This page will stop responding, and the setup network will disappear.'})
.catch(function(){msg.textContent='Save failed. Try again.';
document.getElementById('go').disabled=false})};
</script>

</body>
</html>
